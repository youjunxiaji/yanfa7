name: Build & Release

on:
    push:
        tags:
            - 'v*'
    workflow_dispatch:

permissions:
    contents: write

jobs:
    build-windows:
        name: Build Windows Installer
        runs-on: windows-latest

        steps:
            # ─── 基础环境 ──────────────────────────────────────────
            - name: Checkout
              uses: actions/checkout@v4

            - name: Install uv
              uses: astral-sh/setup-uv@v4

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@stable

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'

            # ─── 后端：Nuitka 打成 sidecar ─────────────────────────
            # tag 触发时按 tag 定版本（v2.1.0 → 2.1.0），写进三处版本号；手动触发沿用仓库里的版本
            - name: Build backend sidecar
              working-directory: backend
              shell: pwsh
              run: |
                  uv sync
                  if ($env:GITHUB_REF_TYPE -eq 'tag') {
                      uv run python build_backend.py --version ($env:GITHUB_REF_NAME -replace '^v', '')
                  } else {
                      uv run python build_backend.py --keep-version
                  }

            # ─── 前端：Tauri 打 NSIS 安装包，收到 output/ ──────────
            - name: Install frontend dependencies
              working-directory: frontend
              run: npm install

            - name: Build Tauri app
              working-directory: frontend
              run: npm run tauri:build

            - name: Upload artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: windows-installer
                  path: output/*.exe

            # ─── 发布到 GitHub Release ─────────────────────────────
            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              if: startsWith(github.ref, 'refs/tags/')
              with:
                  files: output/*.exe
                  generate_release_notes: true
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
