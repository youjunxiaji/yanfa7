[project]
name = "simpleload"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "fastapi>=0.133.0",
    "html5lib>=1.1",
    "jinja2>=3.1.6",
    "loguru>=0.7.3",
    "lxml>=6.0.2",
    "matplotlib>=3.10.8",
    "numpy>=2.3.5",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "plotly>=6.5.0",
    "polars>=1.38.1",
    "uvicorn>=0.41.0",
    "websockets>=16.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "nuitka[onefile]>=4.3",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]

# 每个 app 的测试放在自己的 tests/ 里。目前只有载荷简化有测试，其余配置沿用 simple_load
[tool.pytest.ini_options]
minversion = "8.1"                      # consider_namespace_packages 从 8.1 起才有
testpaths = ["app_*/tests"]             # 新 app 加了 tests/ 会自动收集，不用改这里
pythonpath = ["."]                      # 让测试能直接 import main 和各 app
# app 目录没有 __init__.py，是命名空间包；打开这项，测试模块才按 app_xxx.tests.test_yyy 命名，
# 几个 app 都有 tests/ 时不会撞名
consider_namespace_packages = true
asyncio_mode = "auto"                   # async def 测试无需逐个加 @pytest.mark.asyncio
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers --strict-config"

[tool.coverage.run]
source = ["app_simpleLoad", "main"]
omit = ["*/__pycache__/*", "*/tests/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
