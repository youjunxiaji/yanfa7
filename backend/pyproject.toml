[project]
name = "simpleload"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "fastapi>=0.133.0",
    "html5lib>=1.1",
    "jinja2>=3.1.6",
    "loguru>=0.7.3",
    "lxml>=6.0.2",
    "matplotlib>=3.10.8",
    "numpy>=2.3.5",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "plotly>=6.5.0",
    "polars>=1.38.1",
    "psutil>=7.2.2",
    "pyarrow>=23.0.0",
    "rich>=14.3.2",
    "uvicorn>=0.41.0",
    "websockets>=16.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "nuitka[onefile]>=4.3",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]

# 测试目前只覆盖载荷简化，配置原样沿用 simple_load
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]                      # 让 tests 能直接 import app_simpleLoad / my_websockets / main
asyncio_mode = "auto"                   # async def 测试无需逐个加 @pytest.mark.asyncio
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers --strict-config"

[tool.coverage.run]
source = ["app_simpleLoad", "my_websockets", "main"]
omit = ["*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
